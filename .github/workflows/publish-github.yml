- name: Log in to GitHub Container Registry
  uses: docker/login-action@v3
  with:
    registry: ghcr.io
    username: ${{ github.actor }}
    password: ${{ secrets.GITHUB_TOKEN }}

- name: Build and push Docker image
  uses: docker/build-push-action@v5
  with:
    context: .
    file: src/weatherender/API/Dockerfile
    push: true
    tags: |
      ghcr.io/weatherender-foundation/weatherender-api:latest
      ghcr.io/weatherender-foundation/weatherender-api:${{ github.sha }}
