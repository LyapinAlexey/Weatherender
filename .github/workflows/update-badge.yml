name: Update Code Stats Badge

on:
  push:
    branches: [ main, master, feature/cloc-ignore ]

jobs:
  update-badge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cloc
        run: sudo apt-get update && sudo apt-get install -y cloc

      - name: Calculate lines and update JSON
        run: |
          TOTAL_LINES=$(cloc . --vcs=git --quiet | grep "SUM" | awk '{print $NF}')

          echo "Total lines: $TOTAL_LINES"
          cat << EOF > .github/badge.json
          {
            "schemaVersion": 1,
            "label": "lines of code",
            "message": "${TOTAL_LINES} lines",
            "color": "blue"
          }
          EOF

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update code stats badge [skip ci]"
          file_pattern: ".github/badge.json"
