name: Bug report
description: "Report something that's broken"
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: "Describe the bug"
      description: "A clear and concise description of what the bug is."
      placeholder: "E.g., The application crashes when fetching hourly data..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      description: "Tell us how to reproduce the error."
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
      description: "A clear and concise description of what you expected to happen."
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: "Environment"
      description: "Where did you encounter this bug?"
      options:
        - "Locally (docker-compose)"
        - "Live deployment (production)"
        - "Other"
    validations:
      required: true
  - type: input
    id: context_versions
    attributes:
      label: "Python / OS Version"
      placeholder: "E.g., Python 3.13 on Ubuntu 24.04"
  - type: textarea
    id: context
    attributes:
      label: "Additional context"
      description: "Add any other context, logs, or screenshots about the problem here."
