services:
  weather_db:
    image: postgres:16
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  cache:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  migration:
    build:
      context: .
      dockerfile: src/weatherender/WEB/Dockerfile
    command: alembic upgrade head
    env_file: .env
    depends_on:
      weather_db:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: on-failure
  web:
    build:
      context: .
      dockerfile: src/weatherender/WEB/Dockerfile
    ports:
      - "${FLASK_PORT}:${FLASK_PORT}"
    env_file: .env
    depends_on:
      weather_db:
        condition: service_healthy
      cache:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
  api:
    build:
      context: .
      dockerfile: src/weatherender/API/Dockerfile
    ports:
      - "${API_PORT}:${API_PORT}"
    env_file: .env
    depends_on:
      weather_db:
        condition: service_healthy
      cache:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
  weather_test_db:
    image: postgres:16
    ports:
      - "5436:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_TEST_USER}
      - POSTGRES_PASSWORD=${POSTGRES_TEST_PASSWORD}
      - POSTGRES_DB=${POSTGRES_TEST_DB}
  cli:
    build:
      context: .
      dockerfile: src/weatherender/CLI/Dockerfile
    env_file: .env
    depends_on:
      weather_db:
        condition: service_healthy
      cache:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    stdin_open: true
    tty: true
volumes:
  postgres_data:
