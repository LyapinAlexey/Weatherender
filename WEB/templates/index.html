<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My weather</title>

    <link rel="shortcut icon" href="static/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="static/css/style.css">
    <style>

        .loader {
            display: none;
            margin: 20px auto;
            border: 4px solid #334155;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .weather-info, .forecast-section, .error { display: none; }
    </style>
</head>
<body>
<div class="card">
    <h1>🌤 Weather Forecast</h1>
    <div class="time" id="currentTime"></div>


    <div class="search-form">
        <input type="text" id="cityInput" placeholder="Enter city (e.g., Paris)..." required>
        <button id="searchBtn" type="button">Get Info</button>
    </div>

    <div class="loader" id="loader"></div>
    <p class="error" id="errorBlock" style="color: #ef4444; font-weight: 600;"></p>


    <div class="weather-info" id="weatherInfo">
        <h2 id="locationTitle"></h2>
        <p><strong>🌡 Current Temperature:</strong> <span id="currentTemp"></span>°C</p>
        <p><strong>📝 Condition:</strong> <span id="currentCondition"></span></p>
        <p><strong>☀️ Current UV Index:</strong> <span id="currentUv"></span></p>
        <p><strong>⏲ Current Pressure:</strong> <span id="currentPressure"></span> mmHg</p>
        <p><strong>💧 Humidity:</strong> <span id="currentHumidity"></span>%</p>
    </div>


    <div class="forecast-section" id="forecastSection">
        <h3>⏰ 24-Hour Forecast</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr><th>Time</th><th>Temperature</th><th>Precipitation %</th><th>UV Index</th><th>Pressure</th></tr>
                </thead>
                <tbody id="hourlyTableBody">

                </tbody>
            </table>
        </div>

        <h3>📅 3-Day Forecast</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr><th>Date</th><th>Avg Temp</th><th>Precipitation (mm)</th><th>Max UV</th><th>Wind Speed</th><th>Gusts</th></tr>
                </thead>
                <tbody id="dailyTableBody">

                </tbody>
            </table>
        </div>
    </div>
</div>

<script>

    const BACKEND_URL = 'https://weather-b5e9.onrender.com';


    document.getElementById('currentTime').textContent = `Data for: ${new Date().toLocaleString()}`;

    async function getWeather() {
        const city = document.getElementById('cityInput').value.trim();
        if (!city) return;

        const loader = document.getElementById('loader');
        const errorBlock = document.getElementById('errorBlock');
        const weatherInfo = document.getElementById('weatherInfo');
        const forecastSection = document.getElementById('forecastSection');


        loader.style.display = 'block';
        errorBlock.style.display = 'none';
        weatherInfo.style.display = 'none';
        forecastSection.style.display = 'none';

        try {
            const response = await fetch(`${BACKEND_URL}?city=${encodeURIComponent(city)}`);
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'City not found or server error');
            }


            document.getElementById('locationTitle').textContent = `${data.location.name}, ${data.location.country}`;
            document.getElementById('currentTemp').textContent = data.current.temp_c;
            document.getElementById('currentCondition').textContent = data.current.condition.text;
            document.getElementById('currentUv').textContent = data.current.uv;


            const pressureMm = Math.round(data.current.pressure_mb * 0.750062);
            document.getElementById('currentPressure').textContent = pressureMm;
            document.getElementById('currentHumidity').textContent = data.current.humidity;


            const hourlyBody = document.getElementById('hourlyTableBody');
            hourlyBody.innerHTML = '';

            if (data.hourly && Array.isArray(data.hourly)) {
                data.hourly.forEach(hour => {
                    const row = `<tr>
                        <td><strong>${hour.time}</strong></td>
                        <td>${hour.temp}°C</td>
                        <td>${hour.precipitation}%</td>
                        <td>${hour.uv}</td>
                        <td>${hour.pressure} mmHg</td>
                    </tr>`;
                    hourlyBody.innerHTML += row;
                });
            }

            const dailyBody = document.getElementById('dailyTableBody');
            dailyBody.innerHTML = '';

            if (data.daily && Array.isArray(data.daily)) {
                data.daily.forEach(day => {
                    const row = `<tr>
                        <td><strong>${day.date}</strong></td>
                        <td>${day.temp}°C</td>
                        <td>${day.precipitation} mm</td>
                        <td>${day.uv}</td>
                        <td>${day.wind} km/h</td>
                        <td>${day.gust} km/h</td>
                    </tr>`;
                    dailyBody.innerHTML += row;
                });
            }

            loader.style.display = 'none';
            weatherInfo.style.display = 'block';
            forecastSection.style.display = 'block';

        } catch (error) {
            loader.style.display = 'none';
            errorBlock.textContent = error.message;
            errorBlock.style.display = 'block';
        }
    }
    document.getElementById('searchBtn').addEventListener('click', getWeather);
    document.getElementById('cityInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') getWeather();
    });
</script>
</body>
</html>
